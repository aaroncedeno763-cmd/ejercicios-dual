<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Calc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylespidy.css">
  <script type="module" src="./srccalculadora/index.js" defer></script>
</head>

<body>

  <div class="contenedor">

    <div class="calculadora">

      <h1>SPIDER-CALC</h1>

      <input type="text" class="pantalla" disabled>

      <div class="botones">

        <button type="button" class="borrar">C</button>
        <button type="button" data-valor="(">(</button>
        <button type="button" data-valor=")">)</button>
        <button type="button" data-valor="/">/</button>

        <button type="button" data-valor="7">7</button>
        <button type="button" data-valor="8">8</button>
        <button type="button" data-valor="9">9</button>
        <button type="button" data-valor="*">*</button>

        <button type="button" data-valor="4">4</button>
        <button type="button" data-valor="5">5</button>
        <button type="button" data-valor="6">6</button>
        <button type="button" data-valor="-">-</button>

        <button type="button" data-valor="1">1</button>
        <button type="button" data-valor="2">2</button>
        <button type="button" data-valor="3">3</button>
        <button type="button" data-valor="+">+</button>

        <button type="button" data-valor="0">0</button>
        <button type="button" data-valor=".">.</button>
        <button type="button" class="calcular">=</button>

      </div>

    </div>

    <div class="heroe">
      <img src="./imagenes/Firefly_RemoveBackground.png" alt="Spider-Man">
    </div>

  </div>

</body>

</html>
